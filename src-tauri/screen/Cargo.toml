[package]
name = "vault_buddy_screen"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
# Phase 2's gating spike (spec 6.4). OFF by default: with it off this crate
# still has no `windows` dependency and every phase 1 gate is unchanged.
# Enabling it pulls in Media Foundation and only compiles on Windows.
fmp4-spike = ["dep:windows"]

[dependencies]
vault_buddy_core = { path = "../core" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# NOTE: no `chrono` dependency yet. Task 2's `StagedSidecar::recorded_at` is
# a plain `String` (the timestamp is formatted by whichever task produces
# it), so nothing here calls into chrono; `cargo machete` (a rust-core CI
# gate) fails on a declared-but-unused dependency. Add it back in the task
# that first formats/parses a timestamp with it.

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
# Optional and spike-only. `windows` 0.62 is already in the workspace
# lockfile transitively via tauri, so this pins no new version and adds
# nothing to a default build.
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
] }

# windows-capture and the `windows` crate are deliberately NOT here
# yet. They arrive in phase 2, after the fragmented-MP4 spike decides the
# staged container format. Everything in this crate today except the
# fmp4-spike feature is pure and compiles on any platform.
