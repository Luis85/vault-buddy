[package]
name = "vault_buddy_screen"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
# Spec 6.4's gating spike, RESOLVED 2026-09-19 and kept re-runnable. It no
# longer pulls a dependency in (the `windows` crate is now a real Windows
# dependency of this crate), so this is just a switch on the module.
fmp4-spike = []

[dependencies]
vault_buddy_core = { path = "../core" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# NOTE: no `chrono` dependency yet. Task 2's `StagedSidecar::recorded_at` is
# a plain `String` (the timestamp is formatted by whichever task produces
# it), so nothing here calls into chrono; `cargo machete` (a rust-core CI
# gate) fails on a declared-but-unused dependency. Add it back in the task
# that first formats/parses a timestamp with it.

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
# 0.62 is already in the workspace lockfile transitively via tauri, so this
# pins no new version. windows-capture 2.0.1 requires ^0.62.2, the same one.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
] }

# windows-capture is deliberately NOT here yet. It arrives when the actual
# frame-acquisition engine (Task 5+) lands; this task only needs the
# fragmented-MP4 sink, which uses `windows` directly.
